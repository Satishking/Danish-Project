<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - WhatsApp Automation</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; justify-content: center;
            align-items: center; padding: 20px; font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        .card {
            width: min(440px, 100%); padding: 36px; background: #fff;
            border-radius: 20px; box-shadow: 0 25px 70px rgba(0,0,0,.22);
        }
        h1 { margin: 0 0 12px; color: #333; }
        p { color: #666; line-height: 1.5; }
        label { display: block; margin: 20px 0 8px; font-weight: 700; color: #333; }
        input {
            width: 100%; padding: 13px; border: 2px solid #e5e5e5;
            border-radius: 8px; font-size: 15px;
        }
        input:focus { outline: none; border-color: #667eea; }
        button {
            width: 100%; margin-top: 24px; padding: 14px; border: 0;
            border-radius: 8px; color: #fff; background: #667eea;
            font-size: 15px; font-weight: 700; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Set a new password</h1>
        <p>Your account was migrated from the old login system. For security, replace your temporary password before continuing.</p>
        <form method="POST" action="/change-password">
            <label for="password">New password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required autofocus>
            <label for="confirmPassword">Confirm new password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
            <button type="submit">Save Password</button>
        </form>
    </div>
</body>
</html>
